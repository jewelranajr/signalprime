name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare sources (unzip if the tree was uploaded as a zip)
        run: |
          if [ ! -d "android" ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -1)
            if [ -z "$ZIP" ]; then
              echo "No android/ directory and no zip file found in repo root."
              exit 1
            fi
            echo "Unzipping $ZIP ..."
            unzip -q "$ZIP"
          fi
          ANDROID_DIR=$(find . -maxdepth 3 -type d -name android -not -path "./.git*" | head -1)
          if [ -z "$ANDROID_DIR" ]; then
            echo "android/ directory not found."
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Will build in: $ANDROID_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.ANDROID_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: signalprime-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
