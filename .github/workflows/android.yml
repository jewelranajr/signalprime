name: Build SignalPrime Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare sources
        run: |
          # support both layouts: repo-root android/ or a zip upload containing it
          if [ ! -d "android" ]; then
            for z in *.zip; do
              [ -f "$z" ] && unzip -q "$z" && break
            done
          fi
          if [ -f "android.zip" ] && [ ! -d "android" ]; then
            unzip -q android.zip
          fi
          ls -R | head -50
          test -d android || (echo "no android/ project found" && exit 1)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signalprime-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
